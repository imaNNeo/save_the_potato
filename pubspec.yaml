name: save_the_potato
description: "Save The Potato – Get ready for some non-stop, spin-tastic fun! Your goal? Keep our potato pal from turning into a hot tot or an ice cube."
publish_to: 'none'
version: 2.0.0+20000

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flame: ^1.38.2
  flame_noise: ^0.3.3+23
  flutter_bloc: ^9.1.1
  flame_bloc: ^1.12.24
  equatable: ^3.0.0
  flame_rive: ^1.11.2
  rive: ^0.14.11
  shared_preferences: ^2.5.6
  get_it: ^9.3.0
  flutter_animate: ^4.5.2
  flutter_secure_storage: ^11.2.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_crashlytics: ^6.0.1
  firebase_analytics: ^13.0.1
  cloud_functions: ^7.0.1
  toastification: ^3.2.2
  url_launcher: ^6.3.3
  device_info_plus: ^13.3.0
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  flutter_svg: ^2.3.2
  screenshot: ^3.0.0
  share_plus: ^13.3.1
  stream_transform: ^2.1.2
  flutter_soloud: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  shaders:
    - shaders/background.frag
    - shaders/life_bar.frag

  fonts:
    - family: Cookies
      fonts:
        - asset: assets/fonts/Cookies.ttf

  assets:
    - assets/images/flame/
    - assets/images/flutter_flame/
    - assets/images/snow/
    - assets/images/sparkle/
    - assets/images/orb/
    - assets/images/heart/
    - assets/images/trophy/
    - assets/images/icons/
    - assets/images/
    - assets/fonts/
    - assets/audio/
    - assets/audio/rhythm/
    - assets/audio/motivation/
    - assets/rive/
    - assets/logo/

flutter_launcher_icons:
  android: false
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo-1024.png"
  min_sdk_android: 21