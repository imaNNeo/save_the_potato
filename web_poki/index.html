<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Save The Potato</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body, flutter-view, canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  </style>
  <script>
    // Poki SDK glue. The game keeps working if the SDK is blocked or fails.
    (function () {
      var sdkReady = false, firstFrame = false, loadingSent = false, playing = false;
      function sdk() { return sdkReady && window.PokiSDK ? window.PokiSDK : null; }
      function maybeLoadingFinished() {
        if (loadingSent || !firstFrame || !sdk()) return;
        loadingSent = true;
        sdk().gameLoadingFinished();
      }
      window.potatoPoki = {
        gameplayStart: function () { if (!playing && sdk()) { playing = true; sdk().gameplayStart(); } },
        gameplayStop: function () { if (playing && sdk()) { playing = false; sdk().gameplayStop(); } },
      };
      window.addEventListener('flutter-first-frame', function () { firstFrame = true; maybeLoadingFinished(); });
      // Until the game reports gameplay itself, treat the first press as the start of play.
      window.addEventListener('pointerdown', function () { window.potatoPoki.gameplayStart(); }, { once: true, capture: true });

      var s = document.createElement('script');
      s.src = 'https://game-cdn.poki.com/scripts/v2/poki-sdk.js';
      s.async = true;
      s.onload = function () {
        if (!window.PokiSDK) return;
        window.PokiSDK.init().then(function () { sdkReady = true; maybeLoadingFinished(); })
          .catch(function () { sdkReady = true; maybeLoadingFinished(); });
      };
      document.head.appendChild(s);

      // Stop the page from scrolling on arrow keys, space and wheel.
      window.addEventListener('keydown', function (e) {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space', 'PageUp', 'PageDown'].indexOf(e.key) >= 0 || e.code === 'Space') e.preventDefault();
      }, { passive: false });
      window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
